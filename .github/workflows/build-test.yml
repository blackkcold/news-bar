name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_latest.app/Contents/Developer 2>/dev/null || true

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release 2>&1

      - name: Test
        run: swift test 2>&1