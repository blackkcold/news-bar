name: Build & Test

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Test
        run: swift test 2>&1

      - name: Build
        run: swift build -c release 2>&1
